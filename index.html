<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn With Shafiq - FPSC, PPSC, NTS Prep</title>
    <meta name="description" content="Prepare for your job the smart way — solved MCQs, mock tests and notes, all in one place by Learn With Shafiq.">
    
    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="rOKF1G-r8rw4csNnG_RGH4uDG_JpFhRdofMTEg6lg5I" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

      :root{
        --ink: #14261F;
        --ink-soft: #24382F;
        --paper: #F0EAD9;
        --paper-line: #D9CFB4;
        --gold: #D9A441;
        --gold-deep: #B5842A;
        --pass: #4C9A6B;
        --fail: #C1503D;
        --white: #FBF9F2;
      }

      *{margin:0;padding:0;box-sizing:border-box;}

      body{
        background: var(--paper);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .mono{ font-family:'IBM Plex Mono', monospace; }
      .display{ font-family:'Fraunces', serif; }

      a{ color:inherit; text-decoration:none; }

      /* ===== OMR bubble pattern ===== */
      .omr-pattern{
        position:absolute; inset:0;
        background-image: radial-gradient(circle, rgba(240,234,217,0.10) 1.5px, transparent 1.6px);
        background-size: 26px 26px;
        pointer-events:none;
      }

      /* ===== NAV ===== */
      header.site{
        position: sticky; top:0; z-index: 50;
        background: var(--ink);
        border-bottom: 1px solid rgba(240,234,217,0.12);
      }
      .nav-inner{
        max-width: 1100px; margin:0 auto;
        display:flex; align-items:center; justify-content:space-between;
        padding: 16px 24px;
      }
      .brand{
        display:flex; align-items:center; gap:10px;
        color: var(--paper);
      }
      .brand .seal{
        width:34px; height:34px; border-radius:50%;
        border:2px solid var(--gold);
        display:flex; align-items:center; justify-content:center;
        font-family:'Fraunces', serif; font-weight:700; font-size:15px;
        color: var(--gold);
        flex-shrink:0;
      }
      .brand-name{ font-family:'Fraunces', serif; font-weight:700; font-size:18px; letter-spacing:0.02em; }
      nav.links{ display:flex; gap: 28px; }
      nav.links a{
        color: rgba(240,234,217,0.75); font-size:14px; font-weight:500;
        transition: color 0.2s;
      }
      nav.links a:hover{ color: var(--gold); }
      @media (max-width:640px){ nav.links{ display:none; } }

      /* ===== HERO ===== */
      .hero{
        position:relative;
        background: var(--ink);
        color: var(--white);
        overflow:hidden;
        padding: 88px 24px 96px;
      }
      .hero-inner{
        position:relative; z-index:2;
        max-width: 1020px; margin: 0 auto;
        display:flex; align-items:center; justify-content:space-between;
        gap: 56px;
        flex-wrap:wrap;
      }
      .hero-text{ flex:1 1 420px; text-align:left; max-width:560px; }
      .hero-photo-wrap{
        flex:0 0 auto;
        position:relative;
        width: 280px; height: 280px;
      }
      .hero-photo-wrap .ring{
        position:absolute; inset:-10px;
        border-radius:50%;
        border: 2px dashed rgba(217,164,65,0.5);
      }
      .hero-photo-wrap img{
        width:100%; height:100%; object-fit:cover; border-radius:50%;
        border: 4px solid var(--gold);
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        display:block;
      }
      @media (max-width:820px){
        .hero-inner{ flex-direction:column-reverse; text-align:center; }
        .hero-text{ text-align:center; max-width:100%; }
        .cta-row{ justify-content:center; }
      }

      .eyebrow{
        display:inline-flex; align-items:center; gap:8px;
        font-family:'IBM Plex Mono', monospace;
        font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase;
        color: var(--gold);
        border: 1px solid rgba(217,164,65,0.4);
        padding: 6px 14px; border-radius: 999px;
        margin-bottom: 28px;
      }
      .hero h1{
        font-family:'Fraunces', serif;
        font-weight: 900;
        font-size: clamp(38px, 6.5vw, 66px);
        line-height: 0.98;
        letter-spacing: -0.01em;
        margin-bottom: 22px;
      }
      .hero h1 span{ color: var(--gold); font-style: italic; font-weight:600; }
      .hero p.sub{
        font-size: 18px;
        color: rgba(240,234,217,0.78);
        max-width: 480px; margin: 0 0 40px;
      }
      @media (max-width:820px){ .hero p.sub{ margin: 0 auto 40px; } }
      .cta-row{ display:flex; gap:16px; flex-wrap:wrap; }

      .btn{
        display:inline-flex; align-items:center; gap:10px;
        padding: 14px 26px; border-radius: 8px;
        font-weight:600; font-size:15px;
        cursor:pointer; border: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:hover{ transform: translateY(-2px); }
      .btn-gold{ background: var(--gold); color: var(--ink); }
      .btn-gold:hover{ box-shadow: 0 8px 20px rgba(217,164,65,0.35); }
      .btn-outline{ background: transparent; color: var(--white); border: 1.5px solid rgba(240,234,217,0.35); }
      .btn-outline:hover{ border-color: var(--gold); color: var(--gold); }

      .bubble{
        width:16px; height:16px; border-radius:50%;
        border: 2px solid currentColor;
        display:inline-block;
        position:relative;
      }
      .btn-gold .bubble{ background: var(--ink); border-color: var(--ink); }

      /* stats strip */
      .stats{
        position:relative; z-index:2;
        max-width: 1020px; margin: 56px auto 0;
        display:flex; justify-content:center; gap: 48px; flex-wrap:wrap;
        border-top: 1px solid rgba(240,234,217,0.14);
        padding-top: 32px;
      }
      .stat{ text-align:center; }
      .stat .num{ font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:600; color:var(--gold); }
      .stat .lbl{ font-size:12.5px; color: rgba(240,234,217,0.6); margin-top:4px; }

      /* ===== SECTION SHELL ===== */
      section.block{ padding: 88px 24px; }
      .block-inner{ max-width: 1000px; margin:0 auto; }
      .section-head{ margin-bottom: 48px; }
      .section-eyebrow{
        font-family:'IBM Plex Mono', monospace; font-size:12.5px;
        letter-spacing:0.12em; text-transform:uppercase; color: var(--gold-deep);
        margin-bottom:10px; display:block;
      }
      .section-head h2{
        font-family:'Fraunces', serif; font-weight:700; font-size: clamp(28px,4vw,40px);
      }
      .section-head p{ color:#5C5748; margin-top:12px; max-width:520px; }

      /* ===== FREE ZONE MCQ CARDS ===== */
      .mcq-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; }
      @media (max-width:720px){ .mcq-grid{ grid-template-columns: 1fr; } }

      .mcq-card{
        background: var(--white);
        border: 1.5px solid var(--paper-line);
        border-radius: 10px;
        padding: 24px;
      }
      .mcq-tag{
        font-family:'IBM Plex Mono', monospace; font-size:11px;
        color: var(--gold-deep); letter-spacing:0.08em; text-transform:uppercase;
        margin-bottom: 10px; display:block;
      }
      .mcq-q{ font-weight:600; font-size:15.5px; margin-bottom:16px; }
      .mcq-opts{ display:flex; flex-direction:column; gap:10px; }
      .mcq-opt{
        display:flex; align-items:center; gap:12px;
        padding: 9px 12px; border-radius:6px;
        cursor:pointer; font-size:14px;
        border: 1px solid transparent;
        transition: background 0.15s;
      }
      .mcq-opt:hover{ background: rgba(217,164,65,0.08); }
      .mcq-opt .om-bubble{
        width:20px; height:20px; border-radius:50%; flex-shrink:0;
        border: 2px solid #B9AF93;
        display:flex; align-items:center; justify-content:center;
        font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600; color:#B9AF93;
      }
      .mcq-opt.correct .om-bubble{ background: var(--pass); border-color: var(--pass); color:white; }
      .mcq-opt.correct{ color: var(--pass); font-weight:600; }
      .mcq-opt.wrong .om-bubble{ background: var(--fail); border-color: var(--fail); color:white; }
      .mcq-opt.wrong{ color: var(--fail); }

      .free-note{
        margin-top: 32px; text-align:center;
        font-size:14px; color:#5C5748;
      }
      .free-note a{ color: var(--gold-deep); font-weight:600; border-bottom:1px solid var(--gold-deep); }

      /* ===== ABOUT ===== */
      .about-section{ background: var(--white); }
      .about-grid{
        display:flex; align-items:center; gap:48px; flex-wrap:wrap;
      }
      .about-photo{
        flex:0 0 auto; width:180px; height:180px; border-radius:50%;
        overflow:hidden; border:4px solid var(--gold);
        box-shadow: 0 16px 36px rgba(20,38,31,0.18);
      }
      .about-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
      .about-copy{ flex:1 1 380px; }
      .about-copy h3{ font-family:'Fraunces', serif; font-size:26px; font-weight:700; margin-bottom:6px; }
      .about-copy .role{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--gold-deep); margin-bottom:16px; display:block; }
      .about-copy p{ font-size:15px; color:#4A4636; max-width:560px; margin-bottom:18px; }
      .credentials{ display:flex; gap:10px; flex-wrap:wrap; }
      .credential-pill{
        display:inline-flex; align-items:center; gap:8px;
        background: var(--paper); border:1px solid var(--paper-line);
        padding: 8px 14px; border-radius:999px; font-size:13px; font-weight:500;
      }
      .credential-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold-deep); }

      /* ===== PREMIUM ZONE ===== */
      .premium-section{ background: var(--ink); color: var(--paper); }
      .premium-section .section-head p{ color: rgba(240,234,217,0.65); }
      .premium-section .section-eyebrow{ color: var(--gold); }

      .premium-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:20px; margin-bottom: 48px; }
      @media (max-width:720px){ .premium-grid{ grid-template-columns:1fr; } }

      .premium-card{
        position:relative;
        background: var(--ink-soft);
        border:1px solid rgba(217,164,65,0.2);
        border-radius: 10px;
        padding: 24px;
        overflow:hidden;
      }
      .premium-card::before{
        content:'\1F512';
        position:absolute; top:20px; right:20px;
        font-size:15px; opacity:0.5;
      }
      .premium-card h3{
        font-family:'Fraunces', serif; font-size:18px; font-weight:600;
        margin-bottom:8px; padding-right:24px;
      }
      .premium-card p{ font-size:13.5px; color: rgba(240,234,217,0.55); }
      .blur-lines{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
      .blur-lines span{
        display:block; height:9px; border-radius:4px;
        background: rgba(240,234,217,0.15);
        filter: blur(0.4px);
      }
      .blur-lines span:nth-child(1){ width:100%; }
      .blur-lines span:nth-child(2){ width:82%; }
      .blur-lines span:nth-child(3){ width:60%; }

      .pricing-card{
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
        border-radius: 12px;
        padding: 36px 32px;
        color: var(--ink);
        display:flex; align-items:center; justify-content:space-between;
        flex-wrap:wrap; gap:24px;
      }
      .pricing-card .price-label{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.75; }
      .pricing-card .price{ font-family:'Fraunces', serif; font-weight:800; font-size:38px; margin-top:4px; }
      .pricing-card .price small{ font-size:16px; font-weight:500; }
      .pricing-card .price-note{ font-size:13px; margin-top:8px; max-width:280px; opacity:0.85; }
      .pricing-card .btn{ background: var(--ink); color: var(--gold); flex-shrink:0; }
      .pricing-card .btn:hover{ box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

      /* ===== HOW IT WORKS ===== */
      .steps{ display:grid; grid-template-columns: repeat(3,1fr); gap:28px; }
      @media (max-width:720px){ .steps{ grid-template-columns:1fr; } }
      .step .step-num{
        font-family:'Fraunces', serif; font-weight:800; font-size:34px;
        -webkit-text-stroke: 1.5px var(--gold-deep);
        color: transparent;
        margin-bottom:12px; display:block;
      }
      .step h3{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin-bottom:8px; }
      .step p{ font-size:14px; color:#5C5748; }

      /* ===== FOOTER ===== */
      footer{
        background: var(--ink); color: rgba(240,234,217,0.6);
        padding: 48px 24px 32px;
        text-align:center;
      }
      footer .brand-name{ color: var(--paper); font-size:16px; margin-bottom: 16px; display:block; }
      .footer-links{ display:flex; gap:24px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
      .footer-links a{ font-size
